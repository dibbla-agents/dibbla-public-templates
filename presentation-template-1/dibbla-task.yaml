version: "1"

ports:
  VITE_PORT:
    preferred: 5335
    description: "Vite dev server"

tools:
  winget:
    check: "winget --version"
    # Pre-installed on Windows 10 (1809+) / Windows 11 — no install needed.
  git:
    check: "git --version"
    install:
      darwin: "xcode-select --install 2>/dev/null; until xcode-select -p >/dev/null 2>&1; do sleep 5; done"
      windows: "winget install --id Git.Git --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install git"
      windows: "winget install --id Git.Git --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  node:
    check: "node --version"
    bin_path: "~/.local/node/bin"
    install:
      darwin: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-$(uname -m | sed s/x86_64/x64/).tar.gz" | tar -xz -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      linux: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/).tar.xz" | tar -xJ -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      windows: "winget install --id OpenJS.NodeJS.LTS --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install node"
      windows: "winget install --id OpenJS.NodeJS.LTS --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  dibbla:
    check: "dibbla --version"
    bin_path: "~/.local/bin"
    install:
      darwin: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      linux: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      windows: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://install.dibbla.com/install.ps1 | iex"'
    install_fallback:
      darwin: "brew tap dibbla-agents/tap && brew install dibbla"

steps:
  # ── Tool verification ──────────────────────────────────────────────
  - id: verify-git
    name: "Check Git"
    type: tool_check
    tool: git

  - id: verify-node
    name: "Check Node.js"
    type: tool_check
    tool: node

  - id: verify-dibbla
    name: "Check Dibbla"
    type: tool_check
    tool: dibbla

  # ── AI editor skills ──────────────────────────────────────────────
  - id: install-skills
    name: "Install AI Editor Skills"
    type: command
    run: "npx -y skills add dibbla-agents/skills --skill dibbla -a claude-code -y && npx -y skills add dibbla-agents/skills --skill dibbla -a cursor -y && npx -y skills add dibbla-agents/skills --skill dibbla -a opencode -y"
    depends_on: ["verify-node"]

  # ── Install dependencies ───────────────────────────────────────────
  - id: npm-install
    name: "Install packages"
    type: command
    run: "npm ci"
    depends_on: ["verify-node"]
    retry:
      max_attempts: 2
      delay: "5s"
      on_output: "EPERM"

  # ── Build ──────────────────────────────────────────────────────────
  - id: npm-build
    name: "Build Presentation"
    type: command
    run: "npm run build"
    depends_on: ["npm-install"]

  # ── Dev server ─────────────────────────────────────────────────────
  - id: start-dev-server
    name: "Start frontend server"
    type: command
    mode: background
    run: "npm run dev"
    depends_on: ["npm-install"]

  - id: open-browser
    name: "Open in browser"
    type: command
    run:
      darwin: "sleep 2 && open http://localhost:${VITE_PORT:-5335}"
      linux: "sleep 2 && xdg-open http://localhost:${VITE_PORT:-5335}"
      windows: 'powershell -NoProfile -Command "Start-Sleep -Seconds 2; $p = if ($env:VITE_PORT) { $env:VITE_PORT } else { ''5335'' }; Start-Process (''http://localhost:'' + $p)"'
    depends_on: ["start-dev-server"]
