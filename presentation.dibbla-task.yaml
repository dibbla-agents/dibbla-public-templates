version: "1"

# Slide Deck presentation template.
#
# Usage:
#   mkdir my-deck && cd my-deck
#   dibbla run https://raw.githubusercontent.com/dibbla-agents/dibbla-public-templates/master/presentation.dibbla-task.yaml

ports:
  VITE_PORT:
    preferred: 5335
    description: "Vite dev server"

tools:
  winget:
    check: "winget --version"
    # Pre-installed on Windows 10 (1809+) / Windows 11 — no install needed.
  git:
    check: "git --version"
    install:
      darwin: "xcode-select --install 2>/dev/null; until xcode-select -p >/dev/null 2>&1; do sleep 5; done"
      windows: "winget install --id Git.Git --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install git"
      windows: "winget install --id Git.Git --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  node:
    check: "node --version"
    bin_path: "~/.local/node/bin"
    install:
      darwin: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-$(uname -m | sed s/x86_64/x64/).tar.gz" | tar -xz -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      linux: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/).tar.xz" | tar -xJ -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      windows: "winget install --id OpenJS.NodeJS.LTS --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install node"
      windows: "winget install --id OpenJS.NodeJS.LTS --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  dibbla:
    check: "dibbla --version"
    bin_path: "~/.local/bin"
    install:
      darwin: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      linux: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      windows: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://install.dibbla.com/install.ps1 | iex"'
    install_fallback:
      darwin: "brew tap dibbla-agents/tap && brew install dibbla"

steps:
  # ── Tool verification ──────────────────────────────────────────────
  - id: verify-git
    name: "Check Git"
    type: tool_check
    tool: git

  - id: verify-node
    name: "Check Node.js"
    type: tool_check
    tool: node

  - id: verify-dibbla
    name: "Check Dibbla"
    type: tool_check
    tool: dibbla

  # ── Clone template files into CWD ──────────────────────────────────
  - id: clone-template
    name: "Fetch template files"
    type: command
    run:
      darwin: |
        set -e
        if [ -f package.json ]; then
          echo "Template files already present in $(pwd); skipping clone"
        else
          tmp=$(mktemp -d)
          git clone --depth=1 -b master \
            https://github.com/dibbla-agents/dibbla-public-templates.git "$tmp"
          cp -a "$tmp/presentation-template-1/." .
          rm -rf "$tmp"
          echo "Template files cloned into $(pwd)"
        fi
      linux: |
        set -e
        if [ -f package.json ]; then
          echo "Template files already present in $(pwd); skipping clone"
        else
          tmp=$(mktemp -d)
          git clone --depth=1 -b master \
            https://github.com/dibbla-agents/dibbla-public-templates.git "$tmp"
          cp -a "$tmp/presentation-template-1/." .
          rm -rf "$tmp"
          echo "Template files cloned into $(pwd)"
        fi
      # NOTE: must stay a folded (>-) single-line scalar — the Windows
      # executor runs commands via `cmd /C` and cmd silently stops at the
      # first newline, reporting success without running anything.
      windows: >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        if (Test-Path 'package.json') {
        Write-Host 'Template files already present; skipping clone'
        } else {
        $tmp = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString());
        git clone --depth=1 -b master https://github.com/dibbla-agents/dibbla-public-templates.git $tmp;
        Copy-Item -Path (Join-Path $tmp 'presentation-template-1\*') -Destination . -Recurse -Force;
        Remove-Item -Recurse -Force $tmp;
        Write-Host ('Template files cloned into ' + (Get-Location).Path)
        }"
    depends_on: ["verify-git"]

  # ── AI editor skills ──────────────────────────────────────────────
  - id: install-skills
    name: "Install Dibbla Skill"
    type: command
    run: "dibbla skills install dibbla"
    depends_on: ["update-dibbla"]

  # ── Dibbla update ─────────────────────────────────────────────────
  # Pulls the latest CLI release — ensures login flags used below are available.
  - id: update-dibbla
    name: "Update Dibbla"
    type: command
    run:
      darwin: "curl -fsSL https://install.dibbla.com/install.sh | sh 2>/dev/null || true"
      linux: "curl -fsSL https://install.dibbla.com/install.sh | sh 2>/dev/null || true"
      windows: "powershell -NoProfile -Command \"try { irm https://install.dibbla.com/install.ps1 | iex } catch {}; exit 0\""
    depends_on: ["verify-dibbla"]

  # ── Dibbla login ──────────────────────────────────────────────────
  # Writes DIBBLA_API_TOKEN + DIBBLA_API_URL to ./.env and patches .gitignore.
  # --no-keychain keeps the user's OS keyring clean (Desktop app installs
  # many templates over a project lifetime; we don't want to pollute it).
  # Requires CLI ≥ v1.2.4 — the update-dibbla step above pulls the latest.
  - id: dibbla-login
    name: "Save Dibbla credentials to project .env"
    type: command
    run:
      darwin: "dibbla login --api-key=$DIBBLA_API_TOKEN --api-url=$DIBBLA_AUTH_SERVICE_URL --write-env --no-keychain"
      linux: "dibbla login --api-key=$DIBBLA_API_TOKEN --api-url=$DIBBLA_AUTH_SERVICE_URL --write-env --no-keychain"
      windows: "dibbla login --api-key=%DIBBLA_API_TOKEN% --api-url=%DIBBLA_AUTH_SERVICE_URL% --write-env --no-keychain"
    depends_on: ["verify-dibbla", "clone-template", "update-dibbla"]

  # ── Install dependencies ───────────────────────────────────────────
  - id: npm-install
    name: "Install packages"
    type: command
    run: "npm ci"
    depends_on: ["clone-template", "verify-node"]
    retry:
      max_attempts: 2
      delay: "5s"
      on_output: "EPERM"

  # ── Build ──────────────────────────────────────────────────────────
  - id: npm-build
    name: "Build Presentation"
    type: command
    run: "npm run build"
    depends_on: ["npm-install"]

  # ── Dev server ─────────────────────────────────────────────────────
  # Reclaim the dev port from a previous run of this template. Vite runs with
  # strictPort, so a leftover dev server would otherwise make this run fail —
  # and without it, a silently relocated Vite leaves open-browser pointing at
  # a dead URL.
  - id: reclaim-port
    name: "Reclaim dev port"
    type: command
    run:
      darwin: |
        set -u
        port="${VITE_PORT:-5335}"
        holder=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
        for pid in $holder; do
          cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
          if echo "$cmd" | grep -Eq "vite|node.*vite"; then
            echo "Reclaiming Vite dev server port $port from stale PID $pid"
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
          else
            echo "ERROR: port $port is held by PID $pid — not a previous run of this template." >&2
            echo "       Process: $cmd" >&2
            echo "       Stop that process (e.g. 'kill $pid') and retry." >&2
            exit 1
          fi
        done
      linux: |
        set -u
        port="${VITE_PORT:-5335}"
        holder=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
        for pid in $holder; do
          cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
          if echo "$cmd" | grep -Eq "vite|node.*vite"; then
            echo "Reclaiming Vite dev server port $port from stale PID $pid"
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
          else
            echo "ERROR: port $port is held by PID $pid — not a previous run of this template." >&2
            echo "       Process: $cmd" >&2
            echo "       Stop that process (e.g. 'kill $pid') and retry." >&2
            exit 1
          fi
        done
      windows: >-
        powershell -NoProfile -Command
        "$vp = if ($env:VITE_PORT) { [int]$env:VITE_PORT } else { 5335 };
        $conns = Get-NetTCPConnection -LocalPort $vp -State Listen -ErrorAction SilentlyContinue;
        foreach ($c in $conns) {
        $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue;
        if (-not $p) { continue };
        $cmd = ($p.Path + ' ' + $p.ProcessName);
        if ($cmd -match 'vite|node') {
        Write-Host \"Reclaiming Vite dev server port $vp from stale PID $($p.Id)\";
        Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
        } else {
        Write-Error \"Port $vp is held by PID $($p.Id) ($($p.ProcessName)). Stop that process and retry.\";
        exit 1 } }"
    depends_on: ["npm-install"]

  - id: start-dev-server
    name: "Start frontend server"
    type: command
    mode: background
    run: "npm run dev"
    depends_on: ["reclaim-port"]

  # Confirm the dev server actually answers on the port the browser will open.
  - id: wait-frontend
    name: "Waiting for frontend server"
    type: command
    run:
      darwin: |
        for i in $(seq 1 60); do
          curl -fsS -o /dev/null "http://localhost:${VITE_PORT:-5335}/" 2>/dev/null && exit 0
          sleep 1
        done
        echo "ERROR: the dev server never answered on port ${VITE_PORT:-5335}." >&2
        exit 1
      linux: |
        for i in $(seq 1 60); do
          curl -fsS -o /dev/null "http://localhost:${VITE_PORT:-5335}/" 2>/dev/null && exit 0
          sleep 1
        done
        echo "ERROR: the dev server never answered on port ${VITE_PORT:-5335}." >&2
        exit 1
      windows: >-
        powershell -NoProfile -Command
        "$vp = if ($env:VITE_PORT) { $env:VITE_PORT } else { '5335' };
        for ($i = 0; $i -lt 60; $i++) {
        try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 -Uri ('http://localhost:' + $vp + '/') | Out-Null; exit 0 } catch { };
        Start-Sleep -Seconds 1 };
        Write-Error ('The dev server never answered on port ' + $vp + '.');
        exit 1"
    depends_on: ["start-dev-server"]

  - id: open-browser
    name: "Open in browser"
    type: command
    run:
      darwin: 'if [ -n "${CI}${HEADLESS}${DIBBLA_NO_OPEN}" ]; then echo "[open-browser] skipped (CI/HEADLESS/DIBBLA_NO_OPEN set); visit http://localhost:${VITE_PORT:-5335}"; exit 0; fi; sleep 2; open "http://localhost:${VITE_PORT:-5335}" || echo "[open-browser] could not open a browser; visit http://localhost:${VITE_PORT:-5335}"'
      linux: 'if [ -n "${CI}${HEADLESS}${DIBBLA_NO_OPEN}" ] || { [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; }; then echo "[open-browser] skipped (headless/CI); visit http://localhost:${VITE_PORT:-5335}"; exit 0; fi; sleep 2; xdg-open "http://localhost:${VITE_PORT:-5335}" || echo "[open-browser] could not open a browser; visit http://localhost:${VITE_PORT:-5335}"'
      windows: 'powershell -NoProfile -Command "if ($env:CI -or $env:HEADLESS -or $env:DIBBLA_NO_OPEN) { Write-Host ''[open-browser] skipped''; exit 0 }; Start-Sleep -Seconds 2; $p = if ($env:VITE_PORT) { $env:VITE_PORT } else { ''5335'' }; try { Start-Process (''http://localhost:'' + $p) } catch { Write-Host (''[open-browser] could not open a browser; visit http://localhost:'' + $p) }"'
    depends_on: ["wait-frontend"]
