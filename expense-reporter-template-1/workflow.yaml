name: expense-extractor
label: Expense Extractor
nodes:
  - id: input
    type: api
    inputs:
      - receipts_text
    outputs:
      - receipts_text

  - id: agent
    type: function
    function: reasoning_agent_function
    server: function-server
    inputs:
      model: claude-sonnet-4-6
      prompt_message: null
      system_message: |
        You are an expense report assistant. You read receipt text and extract structured expense data.
        Always respond with valid JSON only — no markdown, no explanation, no code fences.
        Return a JSON array where each element has these fields:
        - vendor: company or merchant name
        - amount: total amount as a number (after tax)
        - currency: 3-letter ISO code (e.g. USD, EUR, SEK)
        - date: in YYYY-MM-DD format
        - category: one of Travel, Meals, Office Supplies, Software, Equipment, Transportation, Accommodation, Other
        - description: brief description of the purchase
        - receipt_ref: receipt or invoice number if present, otherwise null
        - vat: VAT/tax amount as a number if listed separately, otherwise null
        If you cannot determine a field, use null.
    outputs:
      - response

  - id: response
    type: api_response
    linked_to: input
    inputs:
      - expenses

edges:
  - input.receipts_text -> agent.prompt_message
  - agent.response -> response.expenses
