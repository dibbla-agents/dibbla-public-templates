version: "1"

# Expense Reporter template.
#
# Usage:
#   mkdir my-expense-app && cd my-expense-app
#   dibbla run https://raw.githubusercontent.com/dibbla-agents/dibbla-public-templates/master/expense-reporter.dibbla-task.yaml

ports:
  PORT:
    preferred: 8210
    description: "Go backend HTTP server"
  VITE_PORT:
    preferred: 5305
    description: "Vite dev server"

tools:
  winget:
    check: "winget --version"
    # Pre-installed on Windows 10 (1809+) / Windows 11 — no install needed.
  git:
    check: "git --version"
    install:
      darwin: "xcode-select --install 2>/dev/null; until xcode-select -p >/dev/null 2>&1; do sleep 5; done"
      windows: "winget install --id Git.Git --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install git"
      windows: "winget install --id Git.Git --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  node:
    check: "node --version"
    bin_path: "~/.local/node/bin"
    install:
      darwin: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-darwin-$(uname -m | sed s/x86_64/x64/).tar.gz" | tar -xz -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      linux: 'mkdir -p ~/.local && curl -fsSL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/).tar.xz" | tar -xJ -C ~/.local && rm -rf ~/.local/node && mv ~/.local/node-v* ~/.local/node'
      windows: "winget install --id OpenJS.NodeJS.LTS --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install node"
      windows: "winget install --id OpenJS.NodeJS.LTS --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  go:
    check: "go version"
    bin_path: "~/.local/go/bin"
    install:
      darwin: 'mkdir -p ~/.local && rm -rf ~/.local/go && curl -fsSL "https://go.dev/dl/go1.26.2.darwin-$(uname -m | sed s/x86_64/amd64/).tar.gz" | tar -xz -C ~/.local'
      linux: 'mkdir -p ~/.local && rm -rf ~/.local/go && curl -fsSL "https://go.dev/dl/go1.26.2.linux-$(uname -m | sed -e s/x86_64/amd64/ -e s/aarch64/arm64/).tar.gz" | tar -xz -C ~/.local'
      windows: "winget install --id GoLang.Go --scope user --silent -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "brew install go"
      windows: "winget install --id GoLang.Go --silent -e --source winget --accept-source-agreements --accept-package-agreements"
  dibbla:
    check: "dibbla --version"
    bin_path: "~/.local/bin"
    install:
      darwin: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      linux: "curl -fsSL https://install.dibbla.com/install.sh | sh"
      windows: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://install.dibbla.com/install.ps1 | iex"'
    install_fallback:
      darwin: "brew tap dibbla-agents/tap && brew install dibbla"

steps:
  # ── Tool verification ──────────────────────────────────────────────
  - id: verify-git
    name: "Check Git"
    type: tool_check
    tool: git

  - id: verify-node
    name: "Check Node.js"
    type: tool_check
    tool: node

  - id: verify-go
    name: "Check Go"
    type: tool_check
    tool: go

  - id: verify-dibbla
    name: "Check Dibbla"
    type: tool_check
    tool: dibbla

  # ── Clone template files into CWD ──────────────────────────────────
  - id: clone-template
    name: "Fetch template files"
    type: command
    run:
      darwin: |
        set -e
        if [ -f main.go ]; then
          echo "Template files already present in $(pwd); skipping clone"
        else
          tmp=$(mktemp -d)
          git clone --depth=1 -b master \
            https://github.com/dibbla-agents/dibbla-public-templates.git "$tmp"
          cp -a "$tmp/expense-reporter-template-1/." .
          rm -rf "$tmp"
          echo "Template files cloned into $(pwd)"
        fi
      linux: |
        set -e
        if [ -f main.go ]; then
          echo "Template files already present in $(pwd); skipping clone"
        else
          tmp=$(mktemp -d)
          git clone --depth=1 -b master \
            https://github.com/dibbla-agents/dibbla-public-templates.git "$tmp"
          cp -a "$tmp/expense-reporter-template-1/." .
          rm -rf "$tmp"
          echo "Template files cloned into $(pwd)"
        fi
      # NOTE: must stay a folded (>-) single-line scalar — the Windows
      # executor runs commands via `cmd /C` and cmd silently stops at the
      # first newline, reporting success without running anything.
      windows: >-
        powershell -NoProfile -ExecutionPolicy Bypass -Command
        "$ErrorActionPreference = 'Stop';
        if (Test-Path 'main.go') {
        Write-Host 'Template files already present; skipping clone'
        } else {
        $tmp = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString());
        git clone --depth=1 -b master https://github.com/dibbla-agents/dibbla-public-templates.git $tmp;
        Copy-Item -Path (Join-Path $tmp 'expense-reporter-template-1\*') -Destination . -Recurse -Force;
        Remove-Item -Recurse -Force $tmp;
        Write-Host ('Template files cloned into ' + (Get-Location).Path)
        }"
    depends_on: ["verify-git"]

  # ── AI editor skills ──────────────────────────────────────────────
  - id: install-skills
    name: "Install Dibbla Skill"
    type: command
    run: "dibbla skills install dibbla"
    depends_on: ["update-dibbla"]

  # ── Dibbla update ─────────────────────────────────────────────────
  - id: update-dibbla
    name: "Update Dibbla"
    type: command
    run:
      darwin: "curl -fsSL https://install.dibbla.com/install.sh | sh 2>/dev/null || true"
      linux: "curl -fsSL https://install.dibbla.com/install.sh | sh 2>/dev/null || true"
      windows: "powershell -NoProfile -Command \"try { irm https://install.dibbla.com/install.ps1 | iex } catch {}; exit 0\""
    depends_on: ["verify-dibbla"]

  # ── Dibbla login ──────────────────────────────────────────────────
  # Writes DIBBLA_API_TOKEN + DIBBLA_API_URL to ./.env and patches .gitignore.
  # The URL is taken from DIBBLA_AUTH_SERVICE_URL (injected by the steprunner),
  # which matches the parent CLI or Desktop app's configured server — no need
  # to hardcode api.dibbla.net. --no-keychain keeps the OS keyring clean.
  # Requires CLI ≥ v1.2.4 — the update-dibbla step above pulls the latest.
  - id: dibbla-login
    name: "Save Dibbla credentials to project .env"
    type: command
    run:
      darwin: "dibbla login --api-key=$DIBBLA_API_TOKEN --api-url=$DIBBLA_AUTH_SERVICE_URL --write-env --no-keychain"
      linux: "dibbla login --api-key=$DIBBLA_API_TOKEN --api-url=$DIBBLA_AUTH_SERVICE_URL --write-env --no-keychain"
      windows: "dibbla login --api-key=%DIBBLA_API_TOKEN% --api-url=%DIBBLA_AUTH_SERVICE_URL% --write-env --no-keychain"
    depends_on: ["verify-dibbla", "clone-template", "update-dibbla"]

  # ── Write API token to .env ────────────────────────────────────────
  - id: write-env-token
    name: "Save API token to .env"
    type: command
    run:
      darwin: |
        if [ -n "$DIBBLA_API_TOKEN" ]; then
          if grep -q '^DIBBLA_TOKEN=' .env 2>/dev/null; then
            sed -i '' "s|^DIBBLA_TOKEN=.*|DIBBLA_TOKEN=$DIBBLA_API_TOKEN|" .env
          else
            echo "DIBBLA_TOKEN=$DIBBLA_API_TOKEN" >> .env
          fi
        fi
        if grep -q '^MODE=' .env 2>/dev/null; then
          sed -i '' 's|^MODE=.*|MODE=dev|' .env
        else
          echo "MODE=dev" >> .env
        fi
      linux: |
        if [ -n "$DIBBLA_API_TOKEN" ]; then
          if grep -q '^DIBBLA_TOKEN=' .env 2>/dev/null; then
            sed -i "s|^DIBBLA_TOKEN=.*|DIBBLA_TOKEN=$DIBBLA_API_TOKEN|" .env
          else
            echo "DIBBLA_TOKEN=$DIBBLA_API_TOKEN" >> .env
          fi
        fi
        if grep -q '^MODE=' .env 2>/dev/null; then
          sed -i 's|^MODE=.*|MODE=dev|' .env
        else
          echo "MODE=dev" >> .env
        fi
      windows: >-
        powershell -NoProfile -Command
        "if ($env:DIBBLA_API_TOKEN) {
        $f = '.env';
        if (Test-Path $f) { $c = Get-Content $f -Raw;
        if ($c -match '(?m)^DIBBLA_TOKEN=') { $c = $c -replace '(?m)^DIBBLA_TOKEN=.*', ('DIBBLA_TOKEN=' + $env:DIBBLA_API_TOKEN); Set-Content $f $c }
        else { Add-Content $f ('DIBBLA_TOKEN=' + $env:DIBBLA_API_TOKEN) } }
        else { Set-Content $f ('DIBBLA_TOKEN=' + $env:DIBBLA_API_TOKEN) } };
        $f = '.env';
        if (Test-Path $f) { $c = Get-Content $f -Raw;
        if ($c -match '(?m)^MODE=') { $c = $c -replace '(?m)^MODE=.*', 'MODE=dev'; Set-Content $f $c }
        else { Add-Content $f 'MODE=dev' } }
        else { Set-Content $f 'MODE=dev' }"
    depends_on: ["clone-template", "dibbla-login"]

  # ── Frontend build ─────────────────────────────────────────────────
  - id: install-frontend-deps
    name: "Install frontend packages"
    type: command
    run: "npm ci"
    working_dir: "./frontend"
    depends_on: ["clone-template", "verify-node"]
    retry:
      max_attempts: 2
      delay: "5s"
      on_output: "EPERM"

  - id: build-frontend
    name: "Build user interface"
    type: command
    run: "npm run build"
    working_dir: "./frontend"
    depends_on: ["install-frontend-deps"]

  # ── Go build ───────────────────────────────────────────────────────
  - id: go-mod-download
    name: "Install backend packages"
    type: command
    run: "go mod download"
    depends_on: ["clone-template", "verify-go"]

  - id: build-go
    name: "Build application"
    type: command
    run:
      darwin: "go build -o ./bin/server main.go"
      linux: "go build -o ./bin/server main.go"
      windows: "go build -o ./bin/server.exe main.go"
    env:
      CGO_ENABLED: "0"
    depends_on: ["build-frontend", "go-mod-download"]


  # ── Dev servers ────────────────────────────────────────────────────
  - id: reclaim-ports
    name: "Reclaim dev ports"
    type: command
    run:
      darwin: |
        set -u
        mkdir -p .dev
        reclaim() {
          local port="$1"
          local label="$2"
          local match_regex="$3"
          local holder
          holder=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
          if [ -z "$holder" ]; then
            return 0
          fi
          for pid in $holder; do
            local cmd
            cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
            if echo "$cmd" | grep -Eq "$match_regex"; then
              echo "Reclaiming $label port $port from stale PID $pid ($cmd)"
              kill "$pid" 2>/dev/null || true
              sleep 1
              kill -9 "$pid" 2>/dev/null || true
            else
              echo "ERROR: $label port $port is held by PID $pid — not a previous run of this template." >&2
              echo "       Process: $cmd" >&2
              echo "       Stop that process (e.g. 'kill $pid') and retry." >&2
              exit 1
            fi
          done
        }
        # Backend: prefer PID file, then fall back to port holder check.
        if [ -f .dev/backend.pid ]; then
          pid=$(cat .dev/backend.pid 2>/dev/null || echo "")
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
            case "$cmd" in
              *bin/server*|*bin\\server*)
                echo "Reclaiming backend PID $pid from previous run"
                kill "$pid" 2>/dev/null || true
                sleep 1
                kill -9 "$pid" 2>/dev/null || true
                ;;
            esac
          fi
          rm -f .dev/backend.pid .dev/backend.port
        fi
        reclaim "${PORT:-8210}" "backend" "bin/server"
        reclaim "${VITE_PORT:-5305}" "Vite dev server" "vite|node.*vite"
      linux: |
        bash <<'RECLAIM_EOF'
        set -u
        mkdir -p .dev
        reclaim() {
          local port="$1"
          local label="$2"
          local match_regex="$3"
          local holder
          holder=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
          if [ -z "$holder" ]; then
            return 0
          fi
          for pid in $holder; do
            local cmd
            cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
            if echo "$cmd" | grep -Eq "$match_regex"; then
              echo "Reclaiming $label port $port from stale PID $pid ($cmd)"
              kill "$pid" 2>/dev/null || true
              sleep 1
              kill -9 "$pid" 2>/dev/null || true
            else
              echo "ERROR: $label port $port is held by PID $pid — not a previous run of this template." >&2
              echo "       Process: $cmd" >&2
              echo "       Stop that process (e.g. 'kill $pid') and retry." >&2
              exit 1
            fi
          done
        }
        if [ -f .dev/backend.pid ]; then
          pid=$(cat .dev/backend.pid 2>/dev/null || echo "")
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            cmd=$(ps -p "$pid" -o command= 2>/dev/null || echo "")
            case "$cmd" in
              *bin/server*)
                echo "Reclaiming backend PID $pid from previous run"
                kill "$pid" 2>/dev/null || true
                sleep 1
                kill -9 "$pid" 2>/dev/null || true
                ;;
            esac
          fi
          rm -f .dev/backend.pid .dev/backend.port
        fi
        reclaim "${PORT:-8210}" "backend" "bin/server"
        reclaim "${VITE_PORT:-5305}" "Vite dev server" "vite|node.*vite"
        RECLAIM_EOF
      windows: >-
        powershell -NoProfile -Command
        "$ErrorActionPreference = 'Stop';
        New-Item -ItemType Directory -Force -Path .dev | Out-Null;
        function Reclaim($port, $label, $pattern) {
          $conns = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue;
          foreach ($c in $conns) {
            $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue;
            if (-not $p) { continue }
            $cmd = ($p.Path + ' ' + ($p.CommandLine 2>$null));
            if ($cmd -match $pattern) {
              Write-Host \"Reclaiming $label port $port from stale PID $($p.Id) ($($p.ProcessName))\";
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;
            } else {
              Write-Error \"$label port $port is held by PID $($p.Id) ($($p.ProcessName)). Stop that process and retry.\";
              exit 1;
            }
          }
        };
        if (Test-Path .dev\backend.pid) {
          $pid = (Get-Content .dev\backend.pid -ErrorAction SilentlyContinue) -as [int];
          if ($pid) {
            $p = Get-Process -Id $pid -ErrorAction SilentlyContinue;
            if ($p -and ($p.Path -match 'bin\\server')) {
              Write-Host \"Reclaiming backend PID $pid from previous run\";
              Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue;
            }
          }
          Remove-Item -Force -ErrorAction SilentlyContinue .dev\backend.pid, .dev\backend.port;
        };
        $bp = if ($env:PORT) { [int]$env:PORT } else { 8210 };
        $vp = if ($env:VITE_PORT) { [int]$env:VITE_PORT } else { 5305 };
        Reclaim $bp 'backend' 'bin\\server';
        Reclaim $vp 'Vite dev server' 'vite'"
    depends_on: ["build-go", "install-frontend-deps"]

  - id: run-backend
    name: "Start backend server"
    type: command
    mode: background
    run:
      darwin: "./bin/server"
      linux: "./bin/server"
      windows: ".\\bin\\server.exe"
    env:
      PORT: "8210"
    depends_on: ["reclaim-ports"]

  # Can start in parallel with the backend — the Vite proxy uses a dynamic
  # `router` that reads .dev/backend.port on every request, so it self-heals
  # once the backend publishes its actual port.
  - id: start-frontend-dev
    name: "Start frontend server"
    type: command
    mode: background
    run: "npm run dev"
    working_dir: "./frontend"
    depends_on: ["reclaim-ports"]

  # Poll the actual bound port written by the backend (.dev/backend.port),
  # falling back to $PORT while the file is still being created. This keeps
  # the readiness check honest even if the backend fell back to PORT+1.
  - id: wait-backend
    name: "Waiting for backend server"
    type: command
    run:
      darwin: |
        for i in $(seq 1 30); do
          if [ -f .dev/backend.port ]; then
            p=$(cat .dev/backend.port 2>/dev/null)
          else
            p="${PORT:-8210}"
          fi
          (echo > /dev/tcp/localhost/"$p") 2>/dev/null && exit 0
          sleep 1
        done
        exit 1
      linux: |
        bash <<'WAIT_EOF'
        for i in $(seq 1 30); do
          if [ -f .dev/backend.port ]; then
            p=$(cat .dev/backend.port 2>/dev/null)
          else
            p="${PORT:-8210}"
          fi
          (echo > /dev/tcp/localhost/"$p") 2>/dev/null && exit 0
          sleep 1
        done
        exit 1
        WAIT_EOF
      windows: >-
        powershell -NoProfile -Command
        "for ($i = 0; $i -lt 30; $i++) {
        $p = if (Test-Path .dev\backend.port) { (Get-Content .dev\backend.port -Raw).Trim() }
             elseif ($env:PORT) { $env:PORT } else { '8210' };
        try { $c = [System.Net.Sockets.TcpClient]::new(); $c.Connect('127.0.0.1', [int]$p); $c.Close(); exit 0 }
        catch { Start-Sleep -Seconds 1 } };
        exit 1"
    depends_on: ["run-backend"]

  # Verify the exact chain the browser will use: Vite dev server → /api proxy →
  # Go backend. A healthy backend on its own is not enough — if the proxy points
  # at a different port the browser lands straight on an error state.
  - id: wait-frontend
    name: "Waiting for frontend server"
    type: command
    run:
      darwin: |
        for i in $(seq 1 60); do
          curl -fsS "http://localhost:${VITE_PORT:-5305}/api/uploads" 2>/dev/null | grep -q "files" && exit 0
          sleep 1
        done
        echo "ERROR: the frontend could not reach the backend through the Vite proxy on port ${VITE_PORT:-5305}." >&2
        echo "       backend port: $(cat .dev/backend.port 2>/dev/null || echo unknown), expected PORT=${PORT:-8210}" >&2
        exit 1
      linux: |
        for i in $(seq 1 60); do
          curl -fsS "http://localhost:${VITE_PORT:-5305}/api/uploads" 2>/dev/null | grep -q "files" && exit 0
          sleep 1
        done
        echo "ERROR: the frontend could not reach the backend through the Vite proxy on port ${VITE_PORT:-5305}." >&2
        echo "       backend port: $(cat .dev/backend.port 2>/dev/null || echo unknown), expected PORT=${PORT:-8210}" >&2
        exit 1
      windows: >-
        powershell -NoProfile -Command
        "$vp = if ($env:VITE_PORT) { $env:VITE_PORT } else { '5305' };
        for ($i = 0; $i -lt 60; $i++) {
        try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 -Uri ('http://localhost:' + $vp + '/api/uploads');
        if ($r.Content -match 'files') { exit 0 } } catch { };
        Start-Sleep -Seconds 1 };
        Write-Error ('The frontend could not reach the backend through the Vite proxy on port ' + $vp + '.');
        exit 1"
    depends_on: ["start-frontend-dev", "wait-backend"]

  - id: open-browser
    name: "Open in browser"
    type: command
    run:
      darwin: 'if [ -n "${CI}${HEADLESS}${DIBBLA_NO_OPEN}" ]; then echo "[open-browser] skipped (CI/HEADLESS/DIBBLA_NO_OPEN set); visit http://localhost:${VITE_PORT:-5305}"; exit 0; fi; sleep 2; open "http://localhost:${VITE_PORT:-5305}" || echo "[open-browser] could not open a browser; visit http://localhost:${VITE_PORT:-5305}"'
      linux: 'if [ -n "${CI}${HEADLESS}${DIBBLA_NO_OPEN}" ] || { [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; }; then echo "[open-browser] skipped (headless/CI); visit http://localhost:${VITE_PORT:-5305}"; exit 0; fi; sleep 2; xdg-open "http://localhost:${VITE_PORT:-5305}" || echo "[open-browser] could not open a browser; visit http://localhost:${VITE_PORT:-5305}"'
      windows: 'powershell -NoProfile -Command "if ($env:CI -or $env:HEADLESS -or $env:DIBBLA_NO_OPEN) { Write-Host ''[open-browser] skipped''; exit 0 }; Start-Sleep -Seconds 2; $p = if ($env:VITE_PORT) { $env:VITE_PORT } else { ''5305'' }; try { Start-Process (''http://localhost:'' + $p) } catch { Write-Host (''[open-browser] could not open a browser; visit http://localhost:'' + $p) }"'
    depends_on: ["wait-frontend"]
