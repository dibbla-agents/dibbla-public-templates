version: "1"

# Bootstrap task for the "Getting Started (simple website)" template.
#
# Usage:
#   mkdir my-project && cd my-project
#   dibbla run https://raw.githubusercontent.com/dibbla-agents/dibbla-public-templates/master/getting-started.dibbla-task.yaml
#
# This file:
#   1. Verifies git is installed.
#   2. Clones the getting-started-1 subdirectory from this repo into the
#      current working directory (idempotent — skipped if already present).
#   3. Recursively runs the template's own dibbla-task.yaml from inside the
#      cloned directory, which performs the actual setup (tool checks, npm
#      install, go build, dev servers).

tools:
  git:
    check: "git --version"
    install:
      darwin: "brew install git"
      windows: "winget install --id Git.Git -e --source winget --accept-source-agreements --accept-package-agreements"
    install_fallback:
      darwin: "xcode-select --install 2>/dev/null; until xcode-select -p >/dev/null 2>&1; do sleep 5; done"

steps:
  - id: verify-git
    name: "Check Git"
    type: tool_check
    tool: git

  - id: clone-template
    name: "Fetch getting-started-1 into current directory"
    type: command
    run:
      darwin: |
        set -e
        if [ -d getting-started-1 ]; then
          echo "getting-started-1 already exists in $(pwd); skipping clone"
        else
          tmp=$(mktemp -d)
          git clone --depth=1 -b master \
            https://github.com/dibbla-agents/dibbla-public-templates.git "$tmp"
          mv "$tmp/getting-started-1" .
          rm -rf "$tmp"
          echo "Cloned getting-started-1 into $(pwd)/getting-started-1"
        fi
      windows: |
        powershell -NoProfile -ExecutionPolicy Bypass -Command "
          $ErrorActionPreference = 'Stop';
          if (Test-Path 'getting-started-1') {
            Write-Host 'getting-started-1 already exists; skipping clone'
          } else {
            $tmp = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString());
            git clone --depth=1 -b master https://github.com/dibbla-agents/dibbla-public-templates.git $tmp;
            Move-Item -Path (Join-Path $tmp 'getting-started-1') -Destination .;
            Remove-Item -Recurse -Force $tmp;
            Write-Host ('Cloned getting-started-1 into ' + (Get-Location).Path)
          }"
    depends_on: ["verify-git"]

  - id: run-template-setup
    name: "Run getting-started-1 setup pipeline"
    type: command
    run:
      darwin: '"$DIBBLA_CMD" run ./dibbla-task.yaml'
      windows: '"%DIBBLA_CMD%" run ./dibbla-task.yaml'
    working_dir: "./getting-started-1"
    depends_on: ["clone-template"]
